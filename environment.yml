name: igenotyper
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - minimap2>=2.28
  - samtools>=1.20
  - bcftools>=1.20
  - whatshap=2.8
  - bedtools>=2.31
  - canu>=2.3
  - blast>=2.16
  - kalign>=3.4
  - pybigwig>=0.3.22
  - deeptools>=3.5
  - pygenometracks>=3.9
  - pytest  # Required by pyGenomeTracks package metadata.
  - biopython>=1.83
  - pysam>=0.22
  - pybedtools>=0.10
  - networkx>=3.2
  - numpy>=1.26
  - pandas>=2.2
  - matplotlib>=3.8
  - reportlab>=4
  - r-base>=4.3
  - r-ggplot2
  - r-reshape2
  - pip
  - pip:
      - PyVCF3>=1.0.3
